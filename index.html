<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Crew</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2064%2064%22%20width%3D%2264%22%20height%3D%2264%22%3E%20%3Cdefs%3E%20%3CradialGradient%20id%3D%22bg%22%20cx%3D%2230%25%22%20cy%3D%2225%25%22%20r%3D%2290%25%22%3E%20%3Cstop%20offset%3D%220%22%20stop-color%3D%22%23f3a984%22/%3E%20%3Cstop%20offset%3D%221%22%20stop-color%3D%22%23c24e26%22/%3E%20%3C/radialGradient%3E%20%3C/defs%3E%20%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2216%22%20fill%3D%22url%28%23bg%29%22/%3E%20%3Cg%20stroke%3D%22%231a0d07%22%20stroke-width%3D%222.6%22%20stroke-linecap%3D%22round%22%20opacity%3D%22.55%22%3E%20%3Cpath%20d%3D%22M32%2032L32%2014.5M32%2032L48.6%2026.6M32%2032L42.3%2046.2M32%2032L21.7%2046.2M32%2032L15.4%2026.6%22/%3E%20%3C/g%3E%20%3Cg%20fill%3D%22%231a0d07%22%3E%20%3Ccircle%20cx%3D%2232%22%20cy%3D%2214.5%22%20r%3D%225%22/%3E%20%3Ccircle%20cx%3D%2248.6%22%20cy%3D%2226.6%22%20r%3D%225%22/%3E%20%3Ccircle%20cx%3D%2242.3%22%20cy%3D%2246.2%22%20r%3D%225%22/%3E%20%3Ccircle%20cx%3D%2221.7%22%20cy%3D%2246.2%22%20r%3D%225%22/%3E%20%3Ccircle%20cx%3D%2215.4%22%20cy%3D%2226.6%22%20r%3D%225%22/%3E%20%3C/g%3E%20%3Ccircle%20cx%3D%2232%22%20cy%3D%2232%22%20r%3D%226.5%22%20fill%3D%22%23fff4ee%22%20stroke%3D%22%231a0d07%22%20stroke-width%3D%222.6%22/%3E%20%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#08080a; --bg2:#0d0d10; --surface:#121216; --raised:#18181d; --hover:#1f1f25;
  --line:#22222a; --line2:#2d2d36;
  --text:#ececf1; --muted:#9a9aa6; --faint:#62626d;
  --accent:#e07a52; --accent-soft:rgba(224,122,82,.14); --accent-line:rgba(224,122,82,.45);
  --green:#3fd48f; --green-soft:rgba(63,212,143,.12);
  --blue:#6aa4ff; --blue-soft:rgba(106,164,255,.12);
  --teal:#4fd1c5; --teal-soft:rgba(79,209,197,.10);
  --amber:#f2b441; --amber-soft:rgba(242,180,65,.12);
  --red:#ff5d64; --red-soft:rgba(255,93,100,.12);
  --violet:#a98bff; --violet-soft:rgba(169,139,255,.12);
  --r:10px; --r-sm:7px;
  --sans:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono","Cascadia Code",ui-monospace,Consolas,monospace;
  --shadow:0 10px 40px rgba(0,0,0,.55),0 0 0 1px var(--line);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:13px/1.5 var(--sans);-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,textarea,select{font:inherit;color:inherit}
::selection{background:var(--accent-soft)}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:#26262e;border-radius:10px;border:3px solid transparent;background-clip:padding-box}::-webkit-scrollbar-thumb:hover{background:#34343e;background-clip:padding-box;border:3px solid transparent}
.mono{font-family:var(--mono);font-size:12px}
.muted{color:var(--muted)}.faint{color:var(--faint)}

/* ── app shell ─────────────────────────────────────────── */
.app{display:grid;grid-template-rows:56px 1fr;height:100vh}
.top{display:flex;align-items:center;gap:14px;padding:0 18px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,#0e0e12,#0a0a0d)}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;letter-spacing:-.01em;font-size:14px}
.mark{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:radial-gradient(circle at 30% 25%,#f0a07f,#c9532a);color:#1a0d07;font-size:16px;box-shadow:0 0 0 1px rgba(255,255,255,.08) inset,0 6px 18px rgba(224,122,82,.25)}
.chip{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border:1px solid var(--line);border-radius:999px;background:var(--bg2);color:var(--muted);font-size:12px;white-space:nowrap;max-width:360px;overflow:hidden;text-overflow:ellipsis}
.chip b{color:var(--text);font-weight:500}
.stats{display:flex;gap:6px;margin-left:auto}
.stat{display:flex;align-items:center;gap:7px;height:30px;padding:0 11px;border-radius:8px;background:var(--bg2);border:1px solid var(--line);font-size:12px;color:var(--muted)}
.stat b{color:var(--text);font-weight:600;font-variant-numeric:tabular-nums}
.stat{white-space:nowrap}
@media (max-width:1280px){#palBtn{display:none}.stats .stat:nth-child(2){display:none}}
@media (max-width:1000px){.stats .stat:nth-child(3){display:none}#mode .wt{display:none}}
.dot{width:7px;height:7px;border-radius:50%;flex:none}
.btn{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 13px;border-radius:8px;border:1px solid var(--line2);background:var(--raised);cursor:pointer;font-weight:500;font-size:12.5px;transition:background .12s,border-color .12s,transform .06s}
.btn:hover{background:var(--hover);border-color:#3a3a45}.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);border-color:transparent;color:#1b0d06}.btn.primary:hover{background:#ea8a63}
.btn.green{background:var(--green);border-color:transparent;color:#05170e}.btn.green:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}.btn.ghost:hover{background:var(--hover);color:var(--text)}
.btn.danger{color:var(--red)}.btn.danger:hover{background:var(--red-soft);border-color:rgba(255,93,100,.35)}
.btn.sm{height:26px;padding:0 9px;font-size:12px;border-radius:7px}
.btn:disabled{opacity:.45;pointer-events:none}
kbd{font:500 10.5px var(--mono);padding:1px 5px;border-radius:5px;background:#1c1c22;border:1px solid var(--line2);border-bottom-width:2px;color:var(--muted)}

.body{display:grid;grid-template-columns:304px 1fr;min-height:0;position:relative}
.body.drawer-open{grid-template-columns:304px 1fr 440px}
.body.drawer-open .board{grid-template-columns:repeat(4,minmax(180px,1fr))}

/* ── agents rail ───────────────────────────────────────── */
.rail{border-right:1px solid var(--line);padding:14px 12px;overflow:auto;background:var(--bg)}
.sec{display:flex;align-items:center;justify-content:space-between;margin:2px 6px 10px;color:var(--faint);font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:600}
.agent{position:relative;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:11px 12px;margin-bottom:8px;cursor:pointer;transition:border-color .15s,background .15s,box-shadow .15s}
.agent:hover{border-color:var(--line2);background:#15151a}
.agent.sel{border-color:var(--accent-line);box-shadow:0 0 0 3px var(--accent-soft)}
.agent.drop{border-color:var(--accent);background:var(--accent-soft)}
.agent .row1{display:flex;align-items:center;gap:10px}
.av{position:relative;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:13px;background:#1d1d24;color:var(--text);flex:none;text-transform:uppercase}
.av::after{content:"";position:absolute;inset:-3px;border-radius:50%;border:2px solid var(--ring,transparent)}
.av.running::after{--ring:var(--green);animation:pulse 1.6s ease-in-out infinite}
.av.review::after{--ring:var(--blue)}.av.error::after{--ring:var(--red)}.av.killed{opacity:.45}.av.killed::after{--ring:var(--red)}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(1.06)}}
.agent .name{font-weight:600;font-size:13.5px;letter-spacing:-.01em}
.agent .role{color:var(--faint);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{margin-left:auto;display:inline-flex;align-items:center;gap:5px;height:20px;padding:0 8px;border-radius:999px;font-size:11px;font-weight:500;flex:none}
.pill.idle{background:#1a1a20;color:var(--muted)}
.pill.running{background:var(--green-soft);color:var(--green)}
.pill.review{background:var(--blue-soft);color:var(--blue)}
.pill.error{background:var(--red-soft);color:var(--red)}
.pill.killed{background:var(--red-soft);color:var(--red)}
.agent .task{margin-top:9px;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.agent .act{margin-top:3px;font:11.5px var(--mono);color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.agent .act.live{color:var(--muted)}
.subs{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px;min-width:0}
.subchip{display:inline-flex;align-items:center;gap:6px;max-width:100%;min-width:0;font:10.5px var(--mono);color:var(--teal);background:var(--teal-soft);border:1px solid rgba(79,209,197,.22);border-radius:999px;padding:2px 9px 2px 7px}
.subchip .sd,.m.subagent .sd{width:6px;height:6px;border-radius:50%;background:currentColor;flex:none;animation:pulse 1.4s ease-in-out infinite}
.subchip .sl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.subtag{display:inline-flex;align-items:center;gap:4px;white-space:nowrap;flex:none;font:10.5px var(--mono);color:var(--teal);opacity:.75}
.subtag.live{opacity:1}
.subtag.live::before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor;animation:pulse 1.4s ease-in-out infinite}
.si{flex:none;vertical-align:-1px}
.msub{margin-left:12px;padding-left:11px;border-left:2px solid rgba(79,209,197,.35);display:flex;flex-direction:column;gap:4px}
.msub .sublbl{font:10.5px var(--mono);color:var(--teal);opacity:.85}
.m.subagent{display:flex;align-items:center;gap:8px;font:12px var(--mono);color:var(--teal);padding:6px 9px;border-radius:8px;background:var(--teal-soft);border:1px solid rgba(79,209,197,.22);min-width:0}
.m.subagent b{color:var(--text);font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.m.subdone{font:11px var(--mono);color:var(--teal);opacity:.8;margin-left:12px}
.agent .meta{display:flex;gap:10px;margin-top:8px;font:11px var(--mono);color:var(--faint)}
.agent .tools{position:absolute;top:9px;right:9px;display:none;gap:4px}
.agent:hover .tools{display:flex}.agent:hover .pill{visibility:hidden}
.iconbtn{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;border:1px solid var(--line2);background:var(--raised);cursor:pointer;color:var(--muted);font-size:12px}
.iconbtn:hover{color:var(--text);background:var(--hover)}.iconbtn.danger:hover{color:var(--red);border-color:rgba(255,93,100,.4)}
.shimmer{height:2px;margin:10px -12px -11px;border-radius:0 0 var(--r) var(--r);background:linear-gradient(90deg,transparent,var(--green),transparent);background-size:40% 100%;background-repeat:no-repeat;animation:sh 1.5s linear infinite;opacity:.7}
@keyframes sh{from{background-position:-40% 0}to{background-position:140% 0}}

/* ── board ─────────────────────────────────────────────── */
.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.toolbar{display:flex;align-items:center;gap:10px;padding:12px 18px;border-bottom:1px solid var(--line)}
.toolbar h2{margin:0;font-size:14px;font-weight:600;letter-spacing:-.01em}
.filters{display:flex;gap:4px;margin-left:8px;overflow-x:auto;scrollbar-width:none}
.boardhint{margin-left:auto;font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;color:var(--faint)}
@media (max-width:1400px){.body.drawer-open .boardhint{display:none}}
.fbtn{height:26px;padding:0 10px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--muted);cursor:pointer;font-size:12px}
.fbtn.on{background:var(--raised);color:var(--text);border-color:var(--line2)}
.board{flex:1;display:grid;grid-template-columns:repeat(4,minmax(220px,1fr));gap:14px;padding:16px 18px;overflow:auto;min-height:0}
.col{display:flex;flex-direction:column;min-height:0;border-radius:12px;background:var(--bg2);border:1px solid var(--line);transition:border-color .15s,background .15s}
.col.drop{border-color:var(--accent-line);background:#110e0d}
.colh{display:flex;align-items:center;gap:8px;padding:12px 13px 10px;font-weight:600;font-size:12.5px}
.colh .n{color:var(--faint);font-weight:500;font-variant-numeric:tabular-nums}
.cards{padding:2px 9px 10px;overflow:auto;flex:1}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 11px;margin-bottom:8px;cursor:grab;transition:border-color .15s,transform .12s,box-shadow .15s}
.card:hover{border-color:var(--line2);box-shadow:0 4px 18px rgba(0,0,0,.35)}
.card.dragging{opacity:.35}
.card .t{font-weight:500;font-size:13px;line-height:1.4}
.card .d{color:var(--faint);font-size:12px;margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .f{display:flex;align-items:center;gap:7px;margin-top:9px;font-size:11.5px;color:var(--faint)}
.card .who{display:inline-flex;align-items:center;gap:5px;margin-left:auto}
.mini{width:18px;height:18px;border-radius:50%;background:#1f1f27;display:grid;place-items:center;font-size:10px;font-weight:600;color:var(--muted);text-transform:uppercase}
.tag{display:inline-flex;align-items:center;height:19px;padding:0 7px;border-radius:5px;font:500 10.5px var(--mono);letter-spacing:.02em}
.tag.feature,.tag.api{background:var(--accent-soft);color:#f0a07f}
.tag.ui{background:var(--violet-soft);color:var(--violet)}
.tag.bug{background:var(--red-soft);color:#ff8b90}
.tag.test{background:var(--green-soft);color:var(--green)}
.tag.review{background:var(--blue-soft);color:var(--blue)}
.tag.research{background:var(--amber-soft);color:var(--amber)}
.tag.docs,.tag.report{background:#1e1e25;color:#c4c4cf}
.tag.plan,.tag.triage{background:rgba(106,164,255,.08);color:#9cc2ff}
.tag.design{background:var(--violet-soft);color:var(--violet)}
.tag.security{background:var(--red-soft);color:#ff8b90}
.tag.eval,.tag.data,.tag.ml{background:var(--teal-soft);color:var(--teal)}
.tag.ops,.tag.deploy,.tag.chore{background:rgba(242,180,65,.08);color:#e9c27a}
.tag.incident{background:var(--red-soft);color:#ff8b90}
.tag.qa{background:var(--green-soft);color:var(--green)}
.tag.refactor,.tag.spike{background:var(--accent-soft);color:#f0a07f}
.card .cta{margin-top:9px;display:flex;gap:6px}
.card.review{border-color:rgba(106,164,255,.28)}
.card.doing .bar{height:2px;margin:10px -11px -10px;border-radius:0 0 var(--r) var(--r);background:linear-gradient(90deg,transparent,var(--green),transparent);background-size:40% 100%;background-repeat:no-repeat;animation:sh 1.6s linear infinite}
.empty{color:var(--faint);font-size:12px;text-align:center;padding:22px 8px;border:1px dashed var(--line);border-radius:var(--r)}

/* ── drawer ────────────────────────────────────────────── */
.drawer{border-left:1px solid var(--line);background:var(--bg2);display:flex;flex-direction:column;min-height:0;min-width:0}
.dh{padding:14px 16px 12px;border-bottom:1px solid var(--line)}
.dh .row{display:flex;align-items:center;gap:10px}
.dh h3{margin:0;font-size:15px;font-weight:600;letter-spacing:-.01em}
.kv{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.kv span{font:11px var(--mono);color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:2px 7px}
.dactions{display:flex;gap:6px;margin-top:12px}
.stream{flex:1;overflow:auto;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.m{max-width:100%;font-size:13px}
.m.text{white-space:pre-wrap;word-wrap:break-word;line-height:1.55;color:#dcdce3}
.m.you{align-self:flex-end;max-width:88%;background:var(--accent-soft);border:1px solid var(--accent-line);padding:8px 11px;border-radius:12px 12px 4px 12px;white-space:pre-wrap;color:#f6d6c8}
.m.tool{display:flex;align-items:center;gap:8px;font:12px var(--mono);color:var(--muted);padding:6px 9px;border-radius:8px;background:var(--surface);border:1px solid var(--line);min-width:0}
.m.tool .tn{color:var(--text);font-weight:500;flex:none}
.m.tool .td{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--faint)}
.m.toolerr{font:12px var(--mono);color:#ff9a9f;background:var(--red-soft);border-radius:8px;padding:6px 9px;white-space:pre-wrap}
.m.error{color:var(--red);font-size:12.5px;background:var(--red-soft);border:1px solid rgba(255,93,100,.3);border-radius:8px;padding:8px 10px;white-space:pre-wrap}
.m.sys{color:var(--faint);font:11px var(--mono);text-align:center}
.m.done{display:flex;align-items:center;gap:10px;color:var(--faint);font:11px var(--mono)}
.m.done::before,.m.done::after{content:"";flex:1;height:1px;background:var(--line)}
.composer{border-top:1px solid var(--line);padding:12px 14px;background:var(--bg2)}
.inputwrap{display:flex;align-items:flex-end;gap:8px;border:1px solid var(--line2);background:var(--surface);border-radius:12px;padding:8px 8px 8px 12px;transition:border-color .15s,box-shadow .15s}
.inputwrap:focus-within{border-color:var(--accent-line);box-shadow:0 0 0 3px var(--accent-soft)}
textarea{resize:none;border:0;outline:0;background:transparent;width:100%;min-height:22px;max-height:160px;line-height:1.5}
textarea::placeholder,input::placeholder{color:var(--faint)}
.hint{margin-top:7px;font-size:11px;color:var(--faint);display:flex;gap:12px}

/* review */
.summary{white-space:pre-wrap;font-size:13px;line-height:1.55;color:#d6d6de;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:11px 12px}
.diff{font:12px/1.55 var(--mono);border:1px solid var(--line);border-radius:var(--r);overflow:auto;background:#0a0a0c}
.diff div{padding:0 12px;white-space:pre}
.diff .fh{background:#14141a;color:var(--text);font-weight:500;padding:6px 12px;border-top:1px solid var(--line);position:sticky;left:0}
.diff .fh:first-child{border-top:0}
.diff .hk{color:var(--blue);background:rgba(106,164,255,.06)}
.diff .ad{color:#8fe9bb;background:rgba(63,212,143,.08)}
.diff .rm{color:#ff9ea2;background:rgba(255,93,100,.08)}
.diff .cx{color:#8a8a95}
.reviewbar{border-top:1px solid var(--line);padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.label{font-size:11px;color:var(--faint);text-transform:uppercase;letter-spacing:.08em;font-weight:600;margin:4px 0 6px}

/* modal / palette */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(3px);display:none;align-items:flex-start;justify-content:center;padding-top:12vh;z-index:20}
.scrim.on{display:flex;animation:fade .12s ease-out}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{width:min(560px,calc(100vw - 32px));background:var(--surface);border-radius:14px;box-shadow:var(--shadow);overflow:hidden;animation:rise .16s ease-out}
@keyframes rise{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
.modal .mh{padding:14px 16px;border-bottom:1px solid var(--line);font-weight:600;display:flex;align-items:center;justify-content:space-between}
.modal .mb{padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.field{border:1px solid var(--line2);background:var(--bg2);border-radius:9px;padding:9px 11px;outline:0;width:100%}
.field:focus{border-color:var(--accent-line);box-shadow:0 0 0 3px var(--accent-soft)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{height:28px;padding:0 10px;border-radius:7px;border:1px solid var(--line);background:var(--bg2);cursor:pointer;font:500 11.5px var(--mono);color:var(--muted)}
.seg button.on{border-color:var(--accent-line);background:var(--accent-soft);color:#f6c4ae}
.top .btn,.top .chip,.top .stat{white-space:nowrap;flex:none}
@media (max-width:1600px){#palBtn{display:none}}
.trigbtn{cursor:pointer}.trigbtn:hover{border-color:var(--line2);color:var(--text)}

}

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let S = null, view = {drawer: null, filter: 'all', dragging: false, newTag: 'feature', newWho: '', seenFeed: 0};

const MODE_INFO = {
  acceptEdits: {label: 'Accept edits', sub: 'Edits auto-approved. Shell and web only via the allowlist in crew.json.'},
  auto: {label: 'Auto', sub: "Claude Code's safety classifier approves routine actions and blocks risky ones."},
  bypassPermissions: {label: 'Bypass', sub: 'No checks at all. Agents can run any command on this machine.'},
};
const MODEL_INFO = {'': ['Default', 'your CLI default'], fable: ['Fable', 'most capable'], opus: ['Opus', 'deep work'], sonnet: ['Sonnet', 'balanced'], haiku: ['Haiku', 'fast, cheap']};
const modelChip = m => `<span class="mchip ${m || ''}">${esc(MODEL_INFO[m || '']?.[0] || m)}</span>`;
const effortBars = e => { const n = e ? S.efforts.indexOf(e) + 1 : 0; return `<span class="effort" title="effort: ${e || 'default'}">${[1,2,3,4,5].map(i => `<i class="${i <= n ? 'on' : ''}"></i>`).join('')}</span>`; };
const fmtTok = n => { n = n || 0; return n < 1000 ? String(n) : n < 1e6 ? (n / 1e3).toFixed(n < 1e4 ? 1 : 0) + 'k' : (n / 1e6).toFixed(n < 1e7 ? 2 : 1) + 'M'; };
const tokTotal = a => (a.tokens?.in || 0) + (a.tokens?.out || 0) + (a.tokens?.cache || 0);
let showCost = (() => { try { return localStorage.getItem('crew.showCost') !== '0'; } catch { return true; } })();
const costTxt = v => showCost ? ' · ' + money(v) : '';
async function post(path, body) {
  const r = await fetch(path, {method: 'POST', headers: {'Content-Type': 'application/json', 'X-Crew': '1'}, body: JSON.stringify(body)});
  const j = await r.json().catch(() => ({})); if (j.error) toast(j.error, 'var(--red)'); return j;
}
const COLS = [['backlog','Backlog','var(--faint)'],['doing','In progress','var(--green)'],['review','Review','var(--blue)'],['done','Done','var(--violet)']];
const STATUS_DOT = {idle:'var(--faint)',running:'var(--green)',review:'var(--blue)',error:'var(--red)',killed:'var(--red)'};

async function act(action, payload = {}) {
  const r = await fetch('/api/act/' + action, {method:'POST', headers:{'Content-Type':'application/json','X-Crew':'1'}, body: JSON.stringify(payload)});
  const j = await r.json().catch(() => ({}));
  if (j.error) toast(j.error, 'var(--red)');
  return j;
}

function toast(text, color = 'var(--accent)') {
  const el = document.createElement('div');
  el.className = 'toast';
  el.innerHTML = `<span class="dot" style="background:${color}"></span><span>${esc(text)}</span>`;
  $('#toasts').append(el);
  setTimeout(() => { el.style.transition = 'opacity .3s'; el.style.opacity = 0; setTimeout(() => el.remove(), 300); }, 3800);
}

const agent = n => S.agents.find(a => a.name === n);
const task = id => S.tasks.find(t => t.id === id);
const ago = t => { if (!t) return ''; const s = Math.max(0, Math.floor(Date.now()/1000 - t)); return s < 60 ? s + 's' : s < 3600 ? Math.floor(s/60) + 'm ' + (s%60) + 's' : Math.floor(s/3600) + 'h ' + Math.floor(s%3600/60) + 'm'; };
const dur = s => { s = Math.max(0, Math.round(s)); return s < 60 ? s + 's' : s < 3600 ? Math.floor(s/60) + 'm ' + (s%60) + 's' : Math.floor(s/3600) + 'h ' + Math.floor(s%3600/60) + 'm'; };
const money = v => '$' + (v || 0).toFixed(2);

/* ── render ─────────────────────────────────────────── */
function render() {

  $('#trigN').textContent = (S.triggers || []).filter(t => t.enabled).length;
  if ($('#trigModal').classList.contains('on') && tv.mode === 'list') drawTriggers();
  const n = c => S.tasks.filter(t => t.col === c).length;
  const spend = S.agents.reduce((s, a) => s + (a.cost || 0), 0);
  const running = S.agents.filter(a => a.status === 'running').length;

  $('#stats').innerHTML = [
    ['var(--green)', running, 'running'], ['var(--faint)', n('backlog'), 'queued'],

    .map(([c, v, l]) => `<div class="stat"><span class="dot" style="background:${c}"></span><b>${v}</b>${l}${l === 'running' && subsLive ? ` <span class="subtag live" title="subagents running inside agents">${SUBI}${subsLive}</span>` : ''}</div>`).join('') +
    `<div class="stat" title="tokens: input + cache reads + output, all agents"><span class="dot" style="background:var(--violet)"></span><b class="tok">${fmtTok(S.agents.reduce((s, a) => s + tokTotal(a), 0))}</b>tokens${showCost ? ` · <b>${money(spend)}</b>` : ''}<button class="eye" data-toggle-cost title="${showCost ? 'Hide' : 'Show'} price">${showCost ? '$' : '<s>$</s>'}</button></div>`;

  const authErr = S.agents.find(a => /authenticat|login|OAuth/i.test(a.error || ''));
  const b = $('#banner');
  b.classList.toggle('on', !!authErr);
  if (authErr) b.innerHTML = `⚠ Claude Code is signed out, so agents can't run. In a terminal, run <code>claude /login</code>, then respawn the agents.`;

  renderRail(); if (!view.dragging) renderBoard(); renderDrawer(); renderFeed();
}

function renderRail() {
  $('#rail').innerHTML = `<div class="sec"><span>Agents · ${S.agents.length} <span style="font-weight:500;letter-spacing:0;text-transform:none">· ${S.agents.filter(a => a.alive).length} live</span></span><button class="add" data-add-agent title="Add an agent">＋ Add</button></div>` +
    S.agents.map((a, i) => {
      const t = a.task ? task(a.task) : null;
      const sel = view.drawer?.agent === a.name;
      const live = a.status === 'running';
      return `<div class="agent ${sel ? 'sel' : ''}" data-agent="${a.name}" data-drop-agent="${a.name}">
        <div class="row1">
          <div class="av ${a.status}">${esc(a.name[0])}</div>
          <div style="min-width:0"><div class="name">${esc(a.name)}</div><div class="role">${esc(a.role)}</div></div>
          <span class="pill ${a.status}"><span class="dot" style="background:currentColor"></span>${a.status}</span>
          <div class="tools">
            ${a.status === 'killed' || a.status === 'error'
              ? `<button class="iconbtn" data-respawn="${a.name}" title="Respawn">↻</button>`

const SUBI = '<svg class="si" viewBox="0 0 16 16" width="11" height="11" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="4" cy="3.5" r="1.7"/><circle cx="4" cy="12.5" r="1.7"/><circle cx="12" cy="8" r="1.7"/><path d="M4 5.2v5.6M5.7 8h4.6"/></svg>';
function subChips(a) {

    `<span class="subchip"><span class="sd"></span>${SUBI}<span class="sl">${esc(x.type ? `${x.type} · ${x.label}` : x.label)}</span></span>`).join('')}</div>`;
}

function renderBoard() {
  if (document.querySelector('.menu')) return; // keep an open menu anchored
  const tags = ['all', ...S.tags];

  $('#board').innerHTML = COLS.map(([k, label, c]) => {

function card(t) {
  const who = t.who ? `<span class="who"><span class="mini">${esc(t.who[0])}</span>${esc(t.who)}</span>` : `<span class="who faint">anyone</span>`;
  let cta = '';
  if (t.col === 'review') cta = `<div class="cta"><button class="btn sm" data-review="${t.id}" style="border-color:rgba(106,164,255,.35);color:var(--blue)">Review changes</button></div>`;
  if (t.col === 'done' && (t.commit || t.tokens)) cta = `<div class="f mono">${t.commit ? `<span>⎇ ${esc(t.commit)}</span>` : ''}${t.tokens ? `<span class="tok" style="margin-left:auto">${fmtTok(t.tokens)} tok</span>` : ''}</div>`;
  const owner = t.col === 'doing' && t.who ? S.agents.find(a => a.name === t.who) : null;
  const liveSubs = owner ? Object.keys(owner.subs || {}).length : 0;
  const subs = liveSubs ? `<span class="subtag live" title="${liveSubs} subagent${liveSubs > 1 ? 's' : ''} running">${SUBI}${liveSubs}</span>`
    : t.subagents ? `<span class="subtag" title="used ${t.subagents} subagent${t.subagents > 1 ? 's' : ''}">${SUBI}${t.subagents}</span>` : '';
  const hand = t.history?.length ? `<span class="handoff" title="Handed off ${t.history.length}x">↪ ${esc(t.history[t.history.length - 1].who || '')}</span>` : '';
  return `<div class="card ${t.col}" draggable="true" data-card="${t.id}">
    ${t.source ? `<div class="srcl" title="Created by trigger: ${esc(t.source.name)}">${BOLT}${esc(t.source.name)}</div>` : ''}
    <div class="th"><div class="t">${esc(t.title)}</div><button class="kebab" data-menu="${t.id}" title="Hand off or move">⋯</button></div>
    ${t.details ? `<div class="d">${esc(t.details)}</div>` : ''}
    <div class="f"><span class="tag ${t.tag}">${t.tag}</span><span>#${t.id}</span>${hand}${subs}${t.col === 'doing' && t.started ? `<span data-since="${t.started}">${ago(t.started)}</span>` : ''}${who}</div>
    ${cta}${t.col === 'doing' ? '<div class="bar"></div>' : ''}
  </div>`;
}

  box.querySelectorAll('[data-cfg] button').forEach(b => b.onclick = () => { const k = b.parentElement.dataset.cfg; b.parentElement.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b)); save(k, b.dataset.v); });
  const role = $('#cfgRole'), tags = $('#cfgTags');
  role.onblur = () => { if (role.value.trim() !== a.role) save('role', role.value); };
  role.onkeydown = e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); role.blur(); } };
  tags.onblur = () => { if (tags.value !== a.tags.join(', ')) save('tags', tags.value); };
  tags.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); tags.blur(); } };
}

// consecutive lines from the same subagent share one indented, labelled block
function renderLog(log) {
  let out = '', run = [];
  const flush = () => { if (run.length) out += `<div class="msub"><span class="sublbl">↳ ${esc(run[0].sub)}</span>${run.map(msgBody).join('')}</div>`; run = []; };
  for (const m of log) {
    if (m.sub && run.length && run[0].sub !== m.sub) flush();
    if (m.sub) run.push(m); else { flush(); out += msgBody(m); }
  }
  flush();
  return out;
}
function msgBody(m) {
  switch (m.kind) {
    case 'subagent': return `<div class="m subagent"><span class="sd"></span>${SUBI}subagent <b>${esc(m.text)}</b>${m.detail ? `<span class="faint">${esc(m.detail)}</span>` : ''}</div>`;
    case 'subdone': return `<div class="m subdone">${SUBI} ${esc(m.text)} finished · ${esc(m.detail || '')}</div>`;
    case 'you': return `<div class="m you">${esc(m.text)}</div>`;
    case 'text': return `<div class="m text">${esc(m.text)}</div>`;
    case 'tool': return `<div class="m tool"><span>${toolIcon(m.text)}</span><span class="tn">${esc(m.text)}</span><span class="td">${esc(m.detail || '')}</span></div>`;
    case 'toolerr': return `<div class="m toolerr">${esc(m.text)}</div>`;
    case 'error': return `<div class="m error">${esc(m.text)}</div>`;
    case 'done': return `<div class="m done">${esc(m.text)}</div>`;
    default: return `<div class="m sys">${esc(m.text)}</div>`;
  }
}
const toolIcon = n => ({Read:'◫',Edit:'✎',Write:'✎',MultiEdit:'✎',Bash:'›_',Grep:'⌕',Glob:'⌕',WebFetch:'↗',WebSearch:'↗',TodoWrite:'☰',Task:SUBI,Agent:SUBI}[n] || '◆');

function renderReviewDrawer(d, t) {
  if (!t || t.col !== 'review') { view.drawer = null; return renderDrawer(); }
  if (d.querySelector('[data-shell="review"]')?.dataset.id == t.id) return; // keep typed feedback

function renderDiff(p) {
  return p.split('\n').map(l => {
    if (l.startsWith('diff --git')) return `<div class="fh">${esc(l.replace(/^diff --git a\/(\S+) b\/.*/, '$1'))}</div>`;
    if (/^(index |--- |\+\+\+ |new file|deleted file|similarity|rename )/.test(l)) return '';
    if (l.startsWith('@@')) return `<div class="hk">${esc(l)}</div>`;
    if (l.startsWith('+')) return `<div class="ad">${esc(l)}</div>`;

    return `<div class="cx">${esc(l)}</div>`;
  }).join('');
}

        <div class="tn">${esc(tr.name)} <span class="faint" style="font-weight:400">· ${TRIG_KIND[tr.kind].label}</span></div>
        <div class="tw" title="${esc(trigWhat(tr))}">${esc(trigWhat(tr))}</div>
        <div class="tt"><span class="faint">→</span><span class="tag ${esc(tr.task.tag || 'feature')}">${esc(tr.task.tag || 'feature')}</span><span style="overflow:hidden;text-overflow:ellipsis">${esc(tr.task.title)}</span><span class="faint">· ${tr.task.agent ? esc(tr.task.agent) : 'whoever matches'}</span></div>
        ${tr.kind === 'webhook' ? hookBox(tr) : ''}
        <div class="tmeta">${tr.fired ? `fired ${tr.fired}× · last ${ago(tr.last)} ago${tr.note ? ' · ' + esc(tr.note) : ''}` : 'not fired yet'}${tr.kind === 'schedule' && tr.enabled ? ` · next ${fmtWhen(tr.next)}` : ''}${tr.kind === 'poll' && tr.checked ? ` · checked ${ago(tr.checked.t)} ago, exit ${tr.checked.exit}` : ''}</div>
      </div>
      <div class="tact">
        <button class="sw ${tr.enabled ? 'on' : ''}" data-tr-toggle="${tr.id}" title="${tr.enabled ? 'On: click to pause' : 'Off: click to turn on'}"><span></span></button>
        <button class="btn sm" data-tr-run="${tr.id}" title="Fire once now">Run</button>
        <button class="btn sm ghost" data-tr-edit="${tr.id}">Edit</button>
        <button class="iconbtn danger" data-tr-del="${tr.id}" title="Delete trigger">✕</button>
      </div>
    </div>`).join('');
  $('#tmBody').innerHTML = `
    <div class="trow manual"><div class="tic">✋</div><div class="tmain"><div class="tn">Assign a task <span class="faint" style="font-weight:400">· Manual</span></div>
      <div class="tw" style="white-space:normal">Drag a card onto an agent, use a card's ⋯ menu, or press N. Always on.</div></div><div></div></div>
    ${rows || '<div class="empty">No automatic triggers yet. Start from a preset or build your own.</div>'}
    <div><div class="label">Start from a preset</div><div class="presets">${TRIG_PRESETS.map((pr, i) => `<button class="preset" data-tr-preset="${i}"><b>${TRIG_KIND[pr.kind].ic} ${esc(pr.name)}</b><span>${esc(pr.blurb)}</span></button>`).join('')}</div></div>`;
  $('#tmFoot').innerHTML = `<button class="btn primary" data-tr-new>＋ New trigger</button>`;
}
function drawTrigForm() {
  const f = tv.f, sp = f.spec, k = f.kind;
  $('#tmTitle').textContent = tv.id ? 'Edit trigger' : 'New trigger';
  const seg = (attr, key, opts, cur) => `<div class="seg">${opts.map(([v, l]) => `<button data-${attr}="${key}" data-v="${esc(v)}" class="${(cur || '') === v ? 'on' : ''}">${esc(l)}</button>`).join('')}</div>`;
  const CRONS = [['0 9 * * 1-5', 'Weekdays 9:00'], ['0 11 * * 1-5', 'Weekdays 11:00'], ['0 * * * *', 'Hourly'], ['*/15 * * * *', 'Every 15 min'], ['0 2 * * *', 'Nightly 2:00'], ['0 10 * * 1', 'Mondays 10:00']];
  let spec = '';
  if (k === 'schedule') spec = `<div><div class="label">Cron<span class="faint lc">minute hour day month weekday</span></div>
      <input class="field mono" data-s="cron" value="${esc(sp.cron)}" spellcheck="false" autocomplete="off">
      <div class="seg" style="margin-top:8px">${CRONS.map(([v, l]) => `<button data-cron="${v}" class="${sp.cron === v ? 'on' : ''}">${l}</button>`).join('')}</div>
      <div class="thint" id="cronHint">${esc(cronText(sp.cron))}</div></div>`;
  if (k === 'event') spec = `<div><div class="label">When a task</div>${seg('s', 'on', [['review', 'reaches Review'], ['done', 'is approved / done'], ['error', 'fails']], sp.on)}</div>
      <div><div class="label">Tagged</div>${seg('s', 'tag', [['', 'any tag'], ...S.tags.map(t => [t, t])], sp.tag)}</div>
      <div><div class="label">Worked on by</div>${seg('s', 'agent', [['', 'any agent'], ...S.agents.map(a => [a.name, a.name])], sp.agent)}</div>`;
  if (k === 'watch') spec = `<div><div class="label">Files<span class="faint lc">globs inside the project, comma-separated</span></div><input class="field mono" data-s="glob" value="${esc(sp.glob)}" spellcheck="false" autocomplete="off"></div>
      <div class="two"><div><div class="label">Check every (s)</div><input class="field" type="number" min="5" data-s="every" value="${sp.every}"></div>
      <div><div class="label">Quiet period (s)</div><input class="field" type="number" min="0" data-s="cooldown" value="${sp.cooldown}" style="max-width:160px"><div class="thint">At most one task per quiet period; edits inside it are batched.</div></div></div>`;
  if (k === 'poll') spec = `<div><div class="label">Command<span class="faint lc">runs in the project folder, 2 min timeout</span></div><textarea class="field mono" rows="2" data-s="command" spellcheck="false" placeholder="gh run list --status failure --limit 1">${esc(sp.command)}</textarea></div>
      <div class="two"><div><div class="label">Every (min)</div><input class="field" type="number" min="1" data-s="every" value="${sp.every}"></div>
      <div><div class="label">Fire when</div>${seg('s', 'when', [['change', 'output changes'], ['fail', 'it starts failing'], ['output', 'it prints something new']], sp.when)}</div></div>`;
  if (k === 'webhook') spec = `<div class="thint">Saving creates a URL and a secret token. POST to it from CI, a git hook or a script; the body becomes <code>{payload}</code>. The server only listens on this computer, so remote services need a tunnel.</div>`;
  $('#tmBody').innerHTML = `
    <input class="field" data-f="name" placeholder="Name, e.g. Daily standup" value="${esc(f.name)}" maxlength="60" autocomplete="off">
    <div><div class="label">Trigger</div><div class="seg">${Object.entries(TRIG_KIND).map(([v, i]) => `<button data-kind="${v}" class="${k === v ? 'on' : ''}">${i.ic} ${i.label}</button>`).join('')}</div><div class="thint">${esc(TRIG_KIND[k].hint)}</div></div>
    ${spec}
    <div class="tsep">${BOLT} Creates a task</div>
    <input class="field" data-k="title" placeholder="Task title" value="${esc(f.task.title)}" autocomplete="off">
    <textarea class="field" data-k="details" rows="4" placeholder="Details for the agent (optional)">${esc(f.task.details)}</textarea>
    <div class="thint">Placeholders: <code>${TRIG_VARS[k]}</code> <code>{date}</code> <code>{time}</code> <code>{trigger}</code></div>
    <div><div class="label">Tag</div>${seg('k', 'tag', [['', 'feature'], ...S.tags.filter(t => t !== 'feature').map(t => [t, t])], f.task.tag)}</div>
    <div><div class="label">Give it to</div>${seg('k', 'agent', [['', 'whoever matches the tag'], ...S.agents.map(a => [a.name, a.name])], f.task.agent)}</div>`;
  $('#tmFoot').innerHTML = `<button class="btn ghost" data-tr-back>Back</button><button class="btn primary" data-tr-save>${tv.id ? 'Save' : 'Create trigger'}</button>`;
}
$('#trigBtn').onclick = openTriggers;
$('#trigModal').addEventListener('click', async e => {
  const b = e.target.closest('button'); if (!b || b.hasAttribute('data-close')) return;
  const d = b.dataset, find = id => S.triggers.find(t => t.id === id);
  if ('trNew' in d) return editTrig(null);
  if (d.trPreset) { tv = presetForm(+d.trPreset); return drawTriggers(); }
  if (d.trEdit) return editTrig(find(d.trEdit));
  if (d.trToggle) { const tr = find(d.trToggle); return act('trigger_update', {id: tr.id, enabled: !tr.enabled}); }
  if (d.trRun) { const r = await act('trigger_run', {id: d.trRun}); if (r.ok) toast(`${find(d.trRun)?.name}: fired once`, 'var(--amber)'); return; }
  if (d.trDel) { const tr = find(d.trDel); return askConfirm('Delete trigger?', `<b>${esc(tr.name)}</b> stops firing. Tasks it already created stay on the board.`, 'Delete', async () => { await act('trigger_delete', {id: tr.id}); openTriggers(); }, true); }
  if ('trBack' in d) { tv = {mode: 'list'}; return drawTriggers(); }
  if ('trSave' in d) {
    const r = await act(tv.id ? 'trigger_update' : 'trigger_add', tv.id ? {...tv.f, id: tv.id} : tv.f);
    if (r.ok) { toast(tv.id ? 'Trigger saved' : 'Trigger created', 'var(--amber)'); tv = {mode: 'list'}; drawTriggers(); }
    return;
  }
  if (d.copy) { try { await navigator.clipboard.writeText(d.copy); toast('Copied', 'var(--green)'); } catch { toast('Copy failed: select the text instead', 'var(--red)'); } return; }
  if (d.kind) { tv.f.kind = d.kind; tv.f.spec.every = d.kind === 'poll' ? 5 : d.kind === 'watch' ? 10 : tv.f.spec.every; return drawTrigForm(); }
  if (d.cron) { tv.f.spec.cron = d.cron; return drawTrigForm(); }
  if (d.s) { tv.f.spec[d.s] = d.v; return drawTrigForm(); }
  if (d.k) { tv.f.task[d.k] = d.v; return drawTrigForm(); }
});
$('#trigModal').addEventListener('input', e => {
  const el = e.target, d = el.dataset;
  if (d.f) tv.f[d.f] = el.value;
  if (d.k) tv.f.task[d.k] = el.value;
  if (d.s) {
    tv.f.spec[d.s] = el.type === 'number' ? +el.value : el.value;
    if (d.s === 'cron') $('#cronHint').textContent = cronText(el.value);
  }
});

// command palette
let palItems = [], palIdx = 0;
function openPalette() { $('#palette').classList.add('on'); $('#palIn').value = ''; buildPalette(); setTimeout(() => $('#palIn').focus(), 0); }
function buildPalette() {
  const q = $('#palIn').value.toLowerCase();
  const all = [
    {ic: '＋', label: 'New task', k: 'N', run: () => openTask()},
    {ic: '＋', label: 'Add agent', run: () => openAgentModal()},
    {ic: '⌂', label: 'Switch project…', run: () => openProjectModal()},
    {ic: '⚡', label: 'Triggers…', k: 'T', run: () => openTriggers()},
    {ic: '⚡', label: 'New trigger', run: () => { openTriggers(); editTrig(null); }},
    ...(S.triggers || []).map(tr => ({ic: '⚡', label: `Run trigger: ${tr.name}`, run: () => act('trigger_run', {id: tr.id})})),
    {ic: '$', label: showCost ? 'Hide prices' : 'Show prices', run: () => document.querySelector('[data-toggle-cost]')?.click()},
    ...S.agents.map(a => ({ic: '⚙', label: `Model & role: ${a.name}`, run: () => { view.drawer = {agent: a.name}; view.showSettings = true; view.setSig = ''; render(); }})),
    ...S.agents.map(a => ({ic: '−', label: `Remove agent ${a.name}`, run: () => { view.drawer = {agent: a.name}; view.showSettings = true; render(); setTimeout(() => document.querySelector('[data-remove-agent]')?.click(), 0); }})),
    ...S.agents.map(a => ({ic: '›', label: `Message ${a.name}`, run: () => { view.drawer = {agent: a.name}; render(); setTimeout(() => $('#msg')?.focus(), 0); }})),
    ...S.agents.map(a => ({ic: '＋', label: `New task for ${a.name}`, run: () => openTask(a.name)})),
    ...S.agents.filter(a => a.status !== 'killed').map(a => ({ic: '✕', label: `Kill ${a.name}`, run: () => act('kill', {agent: a.name})})),
    ...S.agents.filter(a => a.status === 'killed' || a.status === 'error').map(a => ({ic: '↻', label: `Respawn ${a.name}`, run: () => act('respawn', {agent: a.name})})),
    ...S.tasks.filter(t => t.col === 'review').map(t => ({ic: '◎', label: `Review #${t.id} ${t.title}`, run: () => { view.drawer = {review: t.id}; render(); }})),
    ...S.tasks.flatMap(t => S.agents.filter(a => !['killed', 'error'].includes(a.status) && !(t.col === 'doing' && t.who === a.name)).map(a => ({ic: '↪', label: `Hand #${t.id} ${t.title} → ${a.name}`, run: () => handTo(t.id, a.name)}))),
    ...S.modes.map(m => ({ic: '⛨', label: `Permission mode: ${MODE_INFO[m]?.label || m}`, run: () => setMode(m)})),
  ];
  palItems = all.filter(i => i.label.toLowerCase().includes(q)).slice(0, 40); palIdx = 0; drawPalette();
}
function drawPalette() { $('#palList').innerHTML = palItems.map((i, n) => `<div class="it ${n === palIdx ? 'on' : ''}" data-i="${n}"><span class="ic">${i.ic}</span>${esc(i.label)}${i.k ? `<kbd>${i.k}</kbd>` : ''}</div>`).join('') || '<div class="empty" style="margin:6px">No matches</div>'; }
$('#palIn').addEventListener('input', buildPalette);
$('#palIn').addEventListener('keydown', e => {
  if (e.key === 'ArrowDown') { palIdx = Math.min(palItems.length - 1, palIdx + 1); drawPalette(); e.preventDefault(); }
  if (e.key === 'ArrowUp') { palIdx = Math.max(0, palIdx - 1); drawPalette(); e.preventDefault(); }
  if (e.key === 'Enter' && palItems[palIdx]) { const it = palItems[palIdx]; closeModals(); it.run(); }
});
$('#palList').onclick = e => { const r = e.target.closest('[data-i]'); if (!r) return; const it = palItems[+r.dataset.i]; closeModals(); it.run(); };
$('#palBtn').onclick = openPalette;
$('#mode').onclick = e => { e.stopPropagation(); openModeMenu($('#mode')); };

// global keys
document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); return openPalette(); }
  if (e.key === 't' && !e.ctrlKey && !e.metaKey && !e.altKey && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName) && !document.querySelector('.scrim.on')) { e.preventDefault(); return openTriggers(); }
  if (e.key === 'Escape' && document.querySelector('.menu')) return closeMenu();
  if (e.key === 'Escape') { if (document.querySelector('.scrim.on')) return closeModals(); if (view.drawer) { view.drawer = null; render(); } return; }
  if (/INPUT|TEXTAREA/.test(document.activeElement.tagName) || document.querySelector('.scrim.on')) return;
  if (e.key.toLowerCase() === 'n') { e.preventDefault(); openTask(); }
  if (/^[1-9]$/.test(e.key) && S.agents[+e.key - 1]) { view.drawer = {agent: S.agents[+e.key - 1].name}; render(); }
});

// live timers
setInterval(() => document.querySelectorAll('[data-since]').forEach(el => el.textContent = ago(+el.dataset.since)), 1000);

// deep links: #agent=builder[&settings], #review=3 (or any), #modal=project|task, #palette
let deepLink = location.hash.length > 1 ? new URLSearchParams(location.hash.slice(1)) : null;
function applyDeepLink() {
  const h = deepLink; deepLink = null;
  if (h.get('agent')) view.drawer = {agent: h.get('agent')};
  if (h.has('settings')) { view.showSettings = true; view.setSig = ''; }
  if (h.get('review')) { const t = h.get('review') === 'any' ? S.tasks.find(t => t.col === 'review') : task(+h.get('review')); if (t) view.drawer = {review: t.id}; }
  if (h.get('modal') === 'project') setTimeout(openProjectModal, 0);
  if (h.get('modal') === 'task') setTimeout(() => openTask(), 0);
  if (h.get('modal') === 'triggers') setTimeout(() => { openTriggers(); if (h.get('preset')) { tv = presetForm(+h.get('preset')); drawTriggers(); } }, 0);
  if (h.has('palette')) setTimeout(openPalette, 0);
}
window.addEventListener('hashchange', () => { if (location.hash.length > 1 && S) { deepLink = new URLSearchParams(location.hash.slice(1)); applyDeepLink(); render(); } });
// state stream
function connect() {
  const es = new EventSource('/api/stream');
  es.onopen = () => $('#conn').classList.add('ok');
  es.onmessage = ev => { S = JSON.parse(ev.data); if (deepLink) applyDeepLink(); render(); };
  es.onerror = () => { $('#conn').classList.remove('ok'); };
}
connect();
</script>
</body>
</html>
